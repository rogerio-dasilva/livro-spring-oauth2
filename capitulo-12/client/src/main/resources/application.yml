server:
  port: 9000
  servlet:
    session:
      # Sets the session timeout to 15 minutes
      timeout: 5m

spring:
  http.converters.preferred-json-mapper: jackson
  thymeleaf:
    cache: false
  datasource:
    url: jdbc:h2:tcp://172.19.120.70:5002/h2_data_base;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        show_sql: true
        hbm2ddl:
          auto: validate
