<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>bookserver-client</title>
    <link href="../webjars/bootstrap/4.6.2/css/bootstrap.min.css" rel="stylesheet" media="screen"> </link>
</head>

<body>

<br/>
<div class="container">

    <div class="jumbotron bg-warning">
        <h1>Client</h1>
    </div>

    <h2>Cadastre-se</h2>
    
    <div th:if="${erro}">
        <div class="alert alert-danger" role="alert">
            <span class="glyphicon glyphicon-exclamation-sign" aria-hidden="true"></span>
            <span class="sr-only">Error:</span>
            <span th:text="${erro}"></span> 
        </div>
    </div>

    <form action="#" th:action="@{/usuarios}" th:object="${dadosCadastrais}" method="post">
        <div class="form-group">
            <label for="nome">Nome:</label>
            <input class="form-control" id="nome" type="text" th:field="*{nome}"/>
        </div>

        <div class="form-group">
            <label for="login">Login:</label>
            <input class="form-control" id="login" type="text" th:field="*{login}"/>
        </div>

        <div class="form-group">
            <label for="senha">Senha:</label>
            <input class="form-control" id="senha" type="password" th:field="*{senha}"/>
        </div>

        <div class="form-group">
            <button class="btn btn-primary" type="submit">Enviar</button>
            <button class="btn btn-warning" type="button" onclick="javascript: window.location.href='/'">Cancelar</button>
        </div>
    </form>

</div>
</body>

<script src="../webjars/jquery/2.2.0/jquery.min.js"></script>
<script src="../webjars/bootstrap/4.6.2/js/bootstrap.min.js"></script>

</html>
